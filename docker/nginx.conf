server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA：非静态资源回退到 index.html；/api/ 由部署侧反代到 api 容器
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        return 404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|webp|map)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
